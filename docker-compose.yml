services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kungfu
      POSTGRES_PASSWORD: kungfu
      POSTGRES_DB: kungfuchess
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kungfu -d kungfuchess"]
      interval: 5s
      timeout: 5s
      retries: 10

  game-server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kungfuchess?user=kungfu&password=kungfu
    ports:
      - "8887:8887"

volumes:
  pgdata:
