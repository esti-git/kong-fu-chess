services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kungfu
      POSTGRES_PASSWORD: kungfu
      POSTGRES_DB: kungfuchess
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kungfu -d kungfuchess"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  matchmaker:
    build:
      context: .
      dockerfile: Dockerfile.matchmaker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      MATCHMAKER_PORT: 8081
    expose:
      - "8081"

  allocator:
    build:
      context: .
      dockerfile: Dockerfile.allocator
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      ALLOCATOR_PORT: 8082
    expose:
      - "8082"

  game-server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      matchmaker:
        condition: service_started
      allocator:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kungfuchess?user=kungfu&password=kungfu
      REDIS_URL: redis://redis:6379
      MATCHMAKER_URL: http://matchmaker:8081
      ALLOCATOR_URL: http://allocator:8082
    expose:
      - "8887"

  ws-gateway:
    build:
      context: .
      dockerfile: Dockerfile.wsgateway
    depends_on:
      - game-server
    environment:
      GATEWAY_PORT: 8887
      GAME_SERVER_URL: ws://game-server:8887
    ports:
      - "8887:8887"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.apigateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kungfuchess?user=kungfu&password=kungfu
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"

volumes:
  pgdata:
