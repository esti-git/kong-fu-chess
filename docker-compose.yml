services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kungfu
      POSTGRES_PASSWORD: kungfu
      POSTGRES_DB: kungfuchess
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kungfu -d kungfuchess"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  matchmaker:
    build:
      context: .
      dockerfile: Dockerfile.matchmaker
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      MATCHMAKER_PORT: 8081
      NATS_URL: nats://nats:4222
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  allocator:
    build:
      context: .
      dockerfile: Dockerfile.allocator
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      ALLOCATOR_PORT: 8082
      NATS_URL: nats://nats:4222
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  game-server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      matchmaker:
        condition: service_healthy
      allocator:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kungfuchess?user=kungfu&password=kungfu
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      GAME_SERVER_HOST: ws://game-server:8887
    expose:
      - "8887"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  ws-gateway:
    build:
      context: .
      dockerfile: Dockerfile.wsgateway
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      allocator:
        condition: service_healthy
      game-server:
        condition: service_healthy
    environment:
      GATEWAY_PORT: 8887
      GAME_SERVER_URL: ws://game-server:8887
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
    ports:
      - "8887:8887"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9002/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.apigateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kungfuchess?user=kungfu&password=kungfu
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
