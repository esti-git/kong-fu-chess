apiVersion: apps/v1
kind: Deployment
metadata:
  name: allocator
  namespace: kungfuchess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: allocator
  template:
    metadata:
      labels:
        app: allocator
    spec:
      enableServiceLinks: false
      containers:
        - name: allocator
          image: kungfuchess-allocator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: ALLOCATOR_PORT
              value: "8082"
            - name: NATS_URL
              value: nats://nats:4222
          ports:
            - containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: allocator
  namespace: kungfuchess
spec:
  selector:
    app: allocator
  ports:
    - port: 8082
      targetPort: 8082
