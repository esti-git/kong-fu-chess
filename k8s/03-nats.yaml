apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: kungfuchess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          # -js enables JetStream: GameResultQueue/GameResultWorker (Server_Design.md section 1's
          # decoupled-write queue) need at-least-once delivery, which plain NATS pub/sub (used
          # for seek/cancel elsewhere) doesn't provide.
          args: ["-js", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: kungfuchess
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
