apiVersion: batch/v1
kind: Job
metadata:
  name: queue-test
  namespace: kungfuchess
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: queue
          image: kungfuchess-e2e:local
          imagePullPolicy: IfNotPresent
          command: ["java", "-cp", "classes:test-classes:libs/*", "GameResultQueueTest", "http://api-gateway:8080", "nats://nats:4222"]
