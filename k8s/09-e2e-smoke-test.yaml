apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-smoke-test
  namespace: kungfuchess
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: e2e
          image: kungfuchess-e2e:final-v2
          imagePullPolicy: IfNotPresent
          args: ["http://api-gateway:8080", "ws://ws-gateway:8887"]
