apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kungfuchess
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kungfuchess-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kungfuchess-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kungfuchess-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: kungfuchess
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kungfuchess
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      # game-server shards self-report kfc_game_server_active_rooms -- the metric the HPA
      # eventually reads (via prometheus-adapter) instead of CPU, per Server_Design.md section 4.
      - job_name: game-server
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["kungfuchess"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: game-server
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__address__]
            regex: '(.+):\d+'
            replacement: '${1}:9001'
            target_label: __address__
          - target_label: __metrics_path__
            replacement: /metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: kungfuchess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kungfuchess
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
