apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaker
  namespace: kungfuchess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchmaker
  template:
    metadata:
      labels:
        app: matchmaker
    spec:
      enableServiceLinks: false
      containers:
        - name: matchmaker
          image: kungfuchess-matchmaker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: MATCHMAKER_PORT
              value: "8081"
            - name: NATS_URL
              value: nats://nats:4222
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaker
  namespace: kungfuchess
spec:
  selector:
    app: matchmaker
  ports:
    - port: 8081
      targetPort: 8081
