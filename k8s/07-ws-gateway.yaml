apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
  namespace: kungfuchess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ws-gateway
  template:
    metadata:
      labels:
        app: ws-gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: ws-gateway
          image: kungfuchess-wsgateway:local
          imagePullPolicy: IfNotPresent
          env:
            - name: GATEWAY_PORT
              value: "8887"
            - name: GAME_SERVER_URL
              value: ws://game-server:8887
            - name: REDIS_URL
              value: redis://redis:6379
            - name: NATS_URL
              value: nats://nats:4222
          ports:
            - containerPort: 8887
            - containerPort: 9002
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9002
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ws-gateway
  namespace: kungfuchess
spec:
  type: NodePort
  selector:
    app: ws-gateway
  ports:
    - port: 8887
      targetPort: 8887
      nodePort: 30887
